<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Sherwin Enayati, Penetration Tester</title>
  <desc id="d">Banner with name, role and a terminal showing profile.json</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity=".08"/></pattern>
    <radialGradient id="glow" cx="78%" cy="20%" r="60%"><stop offset="0" stop-color="#22C55E" stop-opacity=".16"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></radialGradient>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .cur { animation: blink 1.1s steps(1) infinite; }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { .cur, .dot { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="340" rx="18" fill="#0F172A"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="1199" height="339" rx="17.5" fill="none" stroke="#94A3B8" stroke-opacity=".18"/>

  <!-- left: identity -->
  <g transform="translate(56 0)">
    <rect x="0" y="58" width="300" height="32" rx="16" fill="#22C55E" fill-opacity=".12" stroke="#22C55E" stroke-opacity=".4"/>
    <circle class="dot" cx="20" cy="74" r="4.5" fill="#22C55E"/>
    <text x="34" y="79" class="sans" font-size="14.5" font-weight="500" fill="#86EFAC">Open to roles · remote or relocation</text>
    <text x="0" y="136" class="mono" font-size="18" font-weight="500" fill="#22C55E">$ whoami</text>
    <text x="0" y="192" class="mono" font-size="54" font-weight="800" fill="#F8FAFC" letter-spacing="-2">Sherwin Enayati</text>
    <text x="0" y="236" class="sans" font-size="21" font-weight="500" fill="#F8FAFC">Penetration Tester · Security Engineer</text>
    <text x="0" y="268" class="sans" font-size="16.5" fill="#94A3B8">Web · Mobile · Network · Active Directory · 4+ years</text>
  </g>

  <!-- right: terminal -->
  <g transform="translate(680 38)">
    <rect width="466" height="264" rx="12" fill="#0B1222" stroke="#94A3B8" stroke-opacity=".2"/>
    <path d="M12 0h442a12 12 0 0 1 12 12v24H0V12A12 12 0 0 1 12 0z" fill="#1B2336"/>
    <circle cx="20" cy="18" r="5.5" fill="#272F42"/><circle cx="38" cy="18" r="5.5" fill="#272F42"/><circle cx="56" cy="18" r="5.5" fill="#272F42"/>
    <text x="233" y="23" text-anchor="middle" class="mono" font-size="12" fill="#94A3B8">~/sherwin</text>
    <g class="mono" font-size="13.5" fill="#94A3B8">
      <text x="20" y="66"><tspan fill="#22C55E">sherwin@github:~$</tspan> cat profile.json</text>
      <text x="20" y="88">{</text>
      <text x="38" y="110"><tspan fill="#7DD3FC">"role"</tspan>: <tspan fill="#86EFAC">"Penetration Tester"</tspan>,</text>
      <text x="38" y="132"><tspan fill="#7DD3FC">"now"</tspan>: <tspan fill="#86EFAC">"Security Engineer @ Keepa"</tspan>,</text>
      <text x="38" y="154"><tspan fill="#7DD3FC">"focus"</tspan>: [<tspan fill="#86EFAC">"web"</tspan>, <tspan fill="#86EFAC">"mobile"</tspan>, <tspan fill="#86EFAC">"network"</tspan>, <tspan fill="#86EFAC">"ad"</tspan>],</text>
      <text x="38" y="176"><tspan fill="#7DD3FC">"reports_for"</tspan>: [<tspan fill="#86EFAC">"engineers"</tspan>, <tspan fill="#86EFAC">"executives"</tspan>]</text>
      <text x="20" y="198">}</text>
      <text x="20" y="220" fill="#64748B"># every finding validated, every fix re-tested</text>
      <text x="20" y="244"><tspan fill="#22C55E">sherwin@github:~$</tspan></text>
    </g>
    <rect class="cur" x="174" y="231" width="8" height="16" fill="#22C55E"/>
  </g>
</svg>
