<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="t d">
  <title id="t">Career attack path</title>
  <desc id="d">2019 Full-stack developer at Aren, 2021 Junior penetration tester at Faraz Pajohan, 2022 Penetration tester at Spara Security Group, 2024 to now Security engineer at Keepa.</desc>
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .edge { stroke: #475569; stroke-width: 2; stroke-dasharray: 6 5; }
      .pulse { animation: run 6s cubic-bezier(.5,0,.3,1) infinite; }
      @keyframes run { 0% { transform: translateX(0); opacity: 0; } 4% { opacity: 1; } 70% { transform: translateX(840px); opacity: 1; } 76%,100% { transform: translateX(840px); opacity: 0; } }
      .ring { animation: ring 6s ease-out infinite; transform-origin: 1020px 92px; transform-box: view-box; }
      @keyframes ring { 0%,70% { opacity: 0; transform: scale(1); } 76% { opacity: .55; } 100% { opacity: 0; transform: scale(1.9); } }
      @media (prefers-reduced-motion: reduce) { .pulse, .ring { animation: none; opacity: 0; } }
    </style>
  </defs>
  <rect width="1200" height="230" rx="18" fill="#0F172A"/>
  <rect x=".5" y=".5" width="1199" height="229" rx="17.5" fill="none" stroke="#94A3B8" stroke-opacity=".18"/>
  <text x="48" y="44" class="mono" font-size="14" fill="#22C55E">// attack path: how I got here</text>
  <text x="1152" y="44" text-anchor="end" class="sans" font-size="13.5" fill="#64748B">drawn the way BloodHound draws a path to Domain Admin</text>

  <line class="edge" x1="208" y1="92" x2="452" y2="92"/>
  <line class="edge" x1="488" y1="92" x2="732" y2="92"/>
  <line class="edge" x1="768" y1="92" x2="996" y2="92"/>
  <g class="mono" font-size="12" fill="#94A3B8" text-anchor="middle">
    <text x="330" y="80">built APIs, then tested them</text>
    <text x="610" y="80">intern to full tester</text>
    <text x="882" y="80">+ AD, phishing sims</text>
  </g>
  <circle class="pulse" cx="190" cy="92" r="5" fill="#22C55E"/>

  <!-- nodes -->
  <g class="sans">
    <g transform="translate(180 92)">
      <circle r="24" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
      <path d="M-4 -6l-6 6 6 6M4 -6l6 6-6 6" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="52" text-anchor="middle" class="mono" font-size="13" fill="#22C55E">2019</text>
      <text y="74" text-anchor="middle" font-size="16" font-weight="600" fill="#F8FAFC">Full-stack developer</text>
      <text y="96" text-anchor="middle" font-size="14" fill="#94A3B8">Aren · intern</text>
    </g>
    <g transform="translate(470 92)">
      <circle r="24" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
      <circle cx="-1.5" cy="-1.5" r="7" fill="none" stroke="#94A3B8" stroke-width="2"/><path d="M4 4l5 5" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <text y="52" text-anchor="middle" class="mono" font-size="13" fill="#22C55E">2021</text>
      <text y="74" text-anchor="middle" font-size="16" font-weight="600" fill="#F8FAFC">Junior penetration tester</text>
      <text y="96" text-anchor="middle" font-size="14" fill="#94A3B8">Faraz Pajohan · intern</text>
    </g>
    <g transform="translate(750 92)">
      <circle r="24" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
      <rect x="-6.5" y="-10" width="13" height="20" rx="2.5" fill="none" stroke="#94A3B8" stroke-width="2"/><path d="M-1.5 6h3" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <text y="52" text-anchor="middle" class="mono" font-size="13" fill="#22C55E">2022</text>
      <text y="74" text-anchor="middle" font-size="16" font-weight="600" fill="#F8FAFC">Penetration tester</text>
      <text y="96" text-anchor="middle" font-size="14" fill="#94A3B8">Spara Security Group</text>
    </g>
    <circle class="ring" cx="1020" cy="92" r="24" fill="none" stroke="#22C55E" stroke-width="2"/>
    <g transform="translate(1020 92)">
      <circle r="31" fill="#22C55E" fill-opacity=".14"/>
      <circle r="24" fill="#22C55E"/>
      <path d="M0 -11l-8 3.4v5.8c0 4.9 3.4 9 8 10.3 4.6-1.3 8-5.4 8-10.3V-7.6z" fill="none" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-3.4 0l2.3 2.3 4.4-4.8" fill="none" stroke="#0F172A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="52" text-anchor="middle" class="mono" font-size="13" fill="#22C55E">2024 – now</text>
      <text y="74" text-anchor="middle" font-size="16" font-weight="600" fill="#F8FAFC">Security engineer</text>
      <text y="96" text-anchor="middle" font-size="14" fill="#94A3B8">Keepa, Shiraz</text>
    </g>
  </g>
</svg>
